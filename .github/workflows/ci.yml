name: Mizan CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Bun
      uses: oven-sh/setup-bun@v1
      with:
        bun-version: latest

    - name: Install Dependencies
      run: bun install

    - name: Run Backend Tests
      working-directory: ./apps/api
      run: bun test

    - name: Build Frontend
      working-directory: ./apps/web
      run: bun run build

  ai-tests:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"

    - name: Install Dependencies
      working-directory: ./apps/ai
      run: |
        pip install --no-cache-dir -r requirements.txt
        pip install --no-cache-dir -r requirements-test.txt

    - name: Run AI Microservice Tests
      working-directory: ./apps/ai
      run: python -m pytest tests/ -v

  build-ai-docker:
    runs-on: ubuntu-latest
    needs: ai-tests

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Build AI Docker Image
      run: docker build -t mizan-ai:test apps/ai/
